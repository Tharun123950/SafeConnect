services:
  # Backend API Express Web Service
  - type: web
    name: socialmedia-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node server.cjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: socialmedia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # Frontend Static Site (Vite React)
  - type: web
    name: socialmedia-frontend
    env: static
    plan: free
    buildCommand: npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: socialmedia-api
          property: url

databases:
  - name: socialmedia-db
    plan: free
